services:
  postgres:
    image: postgres:16-alpine
    container_name: fintwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintwin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fintwin-postgres-data:/var/lib/postgresql/data

volumes:
  fintwin-postgres-data:
